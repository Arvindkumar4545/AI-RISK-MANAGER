services:
  - type: web
    name: atlas-risk-ml
    runtime: python
    rootDir: ml-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_ARTIFACT_URL
        sync: false

  - type: web
    name: atlas-risk-api
    runtime: node
    rootDir: node-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ML_URL
        fromService:
          type: web
          name: atlas-risk-ml
          property: host

  - type: web
    name: atlas-risk-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: atlas-risk-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
