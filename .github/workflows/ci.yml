name: Atlas Risk Manager CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile ml-backend/main.py
      - run: python -c "import json; json.load(open('train_model.ipynb'))"

  validate-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - run: npm ci
      - run: node --check server.js

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
